version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: case-provider-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: case_provider
      POSTGRES_USER: caseuser
      POSTGRES_PASSWORD: casepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseuser -d case_provider"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: case-provider-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./openapi-spec.json:/app/openapi-spec.json:ro

volumes:
  postgres_data:
